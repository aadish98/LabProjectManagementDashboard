name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check audit structure
        run: npm run check:audit-structure

      - name: Build
        run: npm run frontend:build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix backend

      - name: Typecheck
        run: npm run typecheck --prefix backend

      - name: Test
        run: npm test --prefix backend

      - name: Build
        run: npm run build --prefix backend

      - name: Deployment preflight (offline, non-mutating)
        env:
          DEPLOY_PREFLIGHT_OFFLINE: "1"
          GCP_PROJECT_ID: lab-workflow-ci
          GCP_REGION: us-central1
          CLOUD_RUN_SERVICE: lab-workflow-backend
          CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: runtime@lab-workflow-ci.iam.gserviceaccount.com
          CLOUD_BUILD_SERVICE_ACCOUNT: build@lab-workflow-ci.iam.gserviceaccount.com
          ARTIFACT_REGISTRY_REPOSITORY: cloud-run
          GOOGLE_OAUTH_CLIENT_IDS: 123456789-ci.apps.googleusercontent.com
          GOOGLE_OAUTH_TOKEN_CLIENT_ID: 123456789-ci.apps.googleusercontent.com
          GOOGLE_OAUTH_CLIENT_SECRET_NAME: google-oauth-client-secret
          CORS_ALLOWED_ORIGINS: https://ci.invalid
        run: npm run deploy:check --prefix backend

  firestore-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install frontend tooling
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Run Firestore emulator integration tests
        run: npm run test:firestore-emulator

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

  diff-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check pull request diff whitespace
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
